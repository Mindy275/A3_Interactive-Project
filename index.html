<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Star Cave</title>
    <link rel="stylesheet" href="reset.css">
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <main class="cave" id="cave">
        <!-- this will be the wall as seen in the dark-->
        <div class="wall wall-dark"></div>
        <!-- this will be the wall as seen in the torch light-->
        <div class="wall wall-light">
            <p class="painting">cave wall painting will go here</p>
        </div>
        <!-- this will be the dragable torch -->
        <button class="torch" id="torch" aria-label="Drag torch to light up the cave and see what lays in the dark">🕯️</button>
    </main>
</body>
</html>
